<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Dinâmicas</title>
</head>
<body>
    <h1>Imagens que se Adaptam sozinha</h1>
    <p>Teste com imagens dinâmicas</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>
    
    <h1>Reproduzindo áudio</h1>
        <p>Vamos aprender a reproduzir áudios em HTML5</p>
        <audio preload="metadata" autoplay controls>
            <source src="midia/deathduel.mp3" type="audio/mpeg">
            <p>Infelizmente seu navegador não consegue reproduzir áudio, <a href="midia/deathduel.mp3">clique aqui</a> para baixar o áudio.</p>
        </audio>
</body>
</html>
