<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {
          background-color:lightgray;
          height: 100px;
          width: 250px;  
          border: 10px solid lightgray;

          padding: 10px 10px 10px 10px;
          /*ou apenas padding:10px; as 4 sendo iguais 1 vez informado está bom*/

          margin:20px auto 40px auto;

          outline-width: 5px;
          outline-style: dashed;
          outline-color: salmon;
        }

        a {
            border-width: 10px;
            border-style: solid;
            border-color: red;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa Box-level</h1>
    <p>Parágrafos também são exemplos de box-level, porém <a href="#">links são exemplos de inline-level</a>. Vamos ver como isso funciona</p>
</body>
</html>
